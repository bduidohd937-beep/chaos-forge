name: Deploy CHAOS FORGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # 공개 V1.x 사이트는 dist/ 루트에 그대로 둔다.
      # V2 Alpha는 검증된 특정 커밋을 별도 하위 경로에 빌드해서 포함한다.
      - name: Checkout reviewed V2 alpha preview
        uses: actions/checkout@v4
        with:
          ref: ce2a74c0410d7d4d56d8b6df9c09017e84fce20b
          path: reforge-src
          persist-credentials: false

      - name: Install and test V2 preview
        working-directory: reforge-src
        run: |
          npm ci
          npm test -- --run

      - name: Build V2 preview
        working-directory: reforge-src
        run: npm run build

      - name: Include V2 preview without changing the production homepage
        run: |
          mkdir -p dist/preview/v2
          cp -a reforge-src/dist/. dist/preview/v2/
          test -f dist/index.html
          test -f dist/preview/v2/index.html
          test -d dist/preview/v2/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
